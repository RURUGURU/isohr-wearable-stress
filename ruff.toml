target-version = "py311"
line-length = 100
src = ["scripts"]

[lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D203",
  "D213",
  "FBT001",
  "FBT002",
  "FIX002",
  "ISC001",
  "TD002",
  "TD003",
]

[lint.per-file-ignores]
"scripts/test_*.py" = ["ARG", "D", "PLR2004", "S101", "S603", "SLF001"]
"scripts/*.py" = ["INP001", "T201"]
"scripts/__init__.py" = ["D104"]
"scripts/utils_time.py" = ["D100", "D103"]
"scripts/utils_paths.py" = ["D100", "D103"]
"scripts/analysis_diagnostics.py" = ["D100", "D103"]
"scripts/analysis_hrv.py" = ["D100", "D103"]
"scripts/metrics.py" = ["D100", "D101", "D103"]
"scripts/main_revision.py" = ["D100", "D101", "D103", "SLF001"]
"scripts/analysis_adaptation.py" = ["D100", "D103", "PLR0913", "PLR0917", "SLF001"]
"scripts/analysis_context.py" = ["D100", "D103", "SLF001"]
"scripts/analysis_error_strata.py" = ["D100", "D103", "PLR0913", "PLR0917", "SLF001"]

[format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"
